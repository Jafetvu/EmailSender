spring.application.name=EmailSender

# Tamaños de adjuntos/petición
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- SMTP: usar 587 con STARTTLS (recomendado) ---
spring.mail.host=mail.jorgeslubricantes.com.mx
spring.mail.port=587
spring.mail.username=difusion@jorgeslubricantes.com.mx
spring.mail.password=TyD65&00Cab78

spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true

# STARTTLS (TLS explícito). No mezclar con SSL implícito.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Identificación/EHLO: pon aquí el FQDN de tu servidor (ideal: que coincida con el PTR)
spring.mail.properties.mail.smtp.localhost=jorgeslubricantes.com.mx

# Si el certificado del server no encaja con el host, puedes confiar explícitamente (mejor arreglar cert)
spring.mail.properties.mail.smtp.ssl.trust=mail.jorgeslubricantes.com.mx

# Timeouts más prudentes (evitan colgar conexiones y reintentos agresivos)
spring.mail.properties.mail.smtp.connectiontimeout=60000
spring.mail.properties.mail.smtp.timeout=60000
spring.mail.properties.mail.smtp.writetimeout=60000

# Logs de depuración (puedes apagarlo en producción)
spring.mail.properties.mail.debug=true

# Remitentes
spring.mail.properties.mail.from=difusion@jorgeslubricantes.com.mx
spring.mail.properties.mail.reply-to=noreply@jorgeslubricantes.com.mx

# Puerto HTTP de la app
server.port=${PORT:8080}

# --- IMPORTANTE: No usar SSL implícito/SocketFactory con 587 ---
# (Elimina cualquier propiedad de socketFactory y ssl.enable=true si usas 587)

# --- Control de concurrencia para no aventar muchos correos a la vez ---
# Limita el thread-pool por defecto de tareas @Async / @Scheduled (si lo usas)
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=200
spring.task.execution.thread-name-prefix=mailer-
